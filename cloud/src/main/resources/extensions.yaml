listeners:
  - description: "Add comment on issue creation with support SLA and documentation link"
    uuid: "9d114a5b-5a28-445f-acd9-5adbdcec1ab1"
    # Possible events are attachment_created, attachment_deleted, board_configuration_changed, board_created,
    # board_deleted, board_updated, comment_created, comment_deleted, comment_updated, filter_created, filter_deleted,
    # filter_updated, jira:issue_created, jira:issue_deleted, jira:issue_updated, jira:issue_updated_gdpr,
    # issuelink_created, issuelink_deleted, issuetype_created, issuetype_deleted, issuetype_updated,
    # option_attachments_changed, option_issuelinks_changed, option_subtasks_changed, option_timetracking_changed,
    # option_unassigned_issues_changed, option_voting_changed, option_watching_changed, project_created, project_deleted,
    # project_soft_deleted, project_updated, sprint_closed, sprint_created, sprint_deleted, sprint_started,
    # sprint_updated, user_created, user_deleted, user_updated, jira:version_created, jira:version_deleted,
    # jira:version_moved, jira:version_released, jira:version_unreleased, jira:version_updated, worklog_created,
    # worklog_deleted, worklog_updated
    events:
      - jira:issue_created
    file: "CommentOnCreate.groovy"
    executionUser: ADD_ON
    executionCondition: "issue.fields['%customField-epicLink%'] != null"
    projects:
      - "%project-jrtwo%"
  - description: "Add a definition of done checklist to an issue on creation"
    uuid: "625a3d1c-173a-4938-8874-08c4d05812ec"
    events:
      - jira:issue_created
    file: "DefinitionOfDoneListener.groovy"
    executionUser: ADD_ON
    projects:
      - "JRTWO"
  - description: "A Listener with file script - should be stored in the Script Manager"
    uuid: "b2b2345b-23b2-23bc-b2b2-22bc2b234567"
    events:
      - jira:issue_created
    file: "acme/dev/EventScript.groovy"
    executionUser: ADD_ON
    projects:
      - "JRTWO"
  - description: "Add comment when issue moves to Implementing"
    uuid: "b16f16d3-458c-40bb-8b94-ae8e6a78b3ee"
    events:
      - jira:issue_updated
    file: "CommentOnTransition.groovy"
    # This is Jira Expression Language
    executionCondition: |-
      issue.changelogs[0].items.some(changelogItem => 
          changelogItem.field == 'status'
          && changelogItem.fromString == 'Open'
          && changelogItem.toString == 'Implementing'
      )
    executionUser: ADD_ON
    projects:
      - "TES"

