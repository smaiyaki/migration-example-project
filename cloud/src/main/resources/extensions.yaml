    name: "Date Difference"
    # Possible scriptedFieldType: RICH_TEXT_FIELD, NUMBER_FIELD, TEXT_FIELD, DATE_FIELD, DATETIME_FIELD
    scriptedFieldType: "TEXT_FIELD"
