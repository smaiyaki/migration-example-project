behaviours:
  - name: "Test Behavior 1"
    description: "A basic Behaviour"
    uuid: "3fef006e-74ac-4269-8c90-febc05345e48"
    enabled: true
    executionUser: ADD_ON
    config:
      - fieldName: ""
        fieldUuid: "81a205f1-721a-4627-a3f2-c9767e1e83c4"
        path: behaviourA.ts
        event:
          - "ONLOAD"
          - "ONCHANGE"
        viewTypes:
          - "GIC"
          - "IssueTransition"
          - "IssueView"
        affectedFields:
          - "summary"
      - fieldName: ""
        fieldUuid: "3acab36c-89c5-4322-803c-cfcacd0eec9c"
        path: subpackagea/behaviourB.ts
        event:
          - "ONLOAD"
          - "ONCHANGE"
        viewTypes:
          # These are options from Atlassian's UI Modifications framework, determining where your Behaviour will run.
          # See https://developer.atlassian.com/platform/forge/manifest-reference/modules/jira-ui-modifications/
          - "GIC" # Global Issue Create page
          - "IssueTransition" # The new Jira issue transition experience - see https://community.atlassian.com/forums/Jira-articles/Now-GA-try-the-new-issue-transition-experience-in-Jira/ba-p/2734436
          - "IssueView"
        affectedFields:
          - "description"
    mappings:
      "MARK1":
        - "Task"
        - "Story"
        - "Bug"
      "PRAH":
        - "Task"
  - name: "Test Behavior 2"
    description: "A basic Behaviour that shows mappings for all projects"
    uuid: "08669347-45e5-4c89-83ec-5c7b8defbafc"
    enabled: true
    executionUser: ADD_ON
    config:
      - fieldName: ""
        fieldUuid: "81a205f1-721a-4627-a3f2-c9767e1e83c4"
        path: behaviourA.ts
        event:
          - "ONLOAD"
          - "ONCHANGE"
        viewTypes:
          - "GIC"
          - "IssueTransition"
          - "IssueView"
        affectedFields:
          - "summary"
    mappings:
      "all":
        - "Task" # This will include _all_ Work Item Types named "Task". To be more specific and target particular project's Task Work Item Type, use the unique identifier retrieved from the REST API.
        - "Story"
        - "Bug"

workflows:
  - name: "Workflow with file scripts"
    transitions:
      - name: "In Progress"
        postFunctions:
          - parameters:
              id: "3f2e1d0c-4b5a-6c7d-8e9f-0a1b2c3d4e5f"
              config:
                className: "com.adaptavist.sr.cloud.workflow.UpdateIssue"
                uuid: "7d6c5b4a-3e2f-1d0c-9b8a-7f6e5d4c3b2a"
                enabled: true
                executionUser: "ADD_ON"
                description: "Add comment to issue"
                additionalCode:
                  file: "acme/dev/PostFunctionScript.groovy"
  - name: "Software Simplified Workflow for Project MARK1"
    transitions:
      - name: "Create"
        postFunctions:
          - parameters:
              id: "3d366ad1-1b69-484c-a82f-17eceda55fc9"
              config:
                className: "com.adaptavist.sr.cloud.workflow.UpdateIssue"
                uuid: "5142a571-74a1-4ceb-b2a6-895b1f17e5f5"
                enabled: true
                executionUser: "ADD_ON"
                condition: "true || false"
                description: "Add comment to issue"
                additionalCode:
                  script: |
                    import java.time.LocalDateTime
                    Issues.getByKey(issue.key.toString()).addComment("Comment created from ScriptRunner on ${LocalDateTime.now()}")
      - name: "In Progress"
        postFunctions:
          # The actions below provide an example for all of ScriptRunner's built-in workflow functions
          # See also https://docs.adaptavist.com/sr4jc/latest/features/workflow-rules/perform-actions/built-in-workflow-actions
          # 1. Modify Work Item (UpdateIssue) — runs a script that updates the current issue
          - parameters:
              id: "5a96894a-204c-416d-8d09-bbbfcb18b8a6"
              config:
                className: "com.adaptavist.sr.cloud.workflow.UpdateIssue"
                uuid: "79aecc0f-b4aa-454a-b91b-4a5c104eadda"
                enabled: true
                executionUser: "ADD_ON"
                conditionFile: "SimpleBooleanExpression.groovy"
                description: "Add comment to issue"
                additionalCode:
                  script: "Issues.getByKey(issue.key.toString()).addComment('Greetings from ScriptRunner')"
          # 2. Run Script — executes arbitrary Groovy code on transition
          - parameters:
              id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              config:
                className: "com.adaptavist.sr.cloud.workflow.RunScript"
                uuid: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                enabled: true
                executionUser: "ADD_ON"
                condition: "true || false" # Inline conditions are possible, though using a conditionFile is recommended for code reuse
                description: "Log the transition to the issue as a comment"
                additionalCode:
                  script: |
                    import java.time.LocalDateTime
                    def currentIssue = Issues.getByKey(issue.key.toString())
                    currentIssue.addComment("Issue moved to In Progress at ${LocalDateTime.now()}")
          # 3. Assign Work Item (AssignToUserInGroup) — assigns to the last assigned user in a role or group
          - parameters:
              id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
              config:
                className: "com.adaptavist.sr.cloud.workflow.AssignToUserInGroup"
                uuid: "d4e5f6a7-b8c9-0123-defa-234567890123"
                enabled: true
                executionUser: "ADD_ON"
                description: "Assign to last user in Developers group"
                groupName: "%group-devs%"
                roleId: "%projectRole-member%" # Space role is optional, but you do need to supply empty string
          # 4. Clone Work Item (CloneIssue) — clones the issue, optionally into a different project/type
          - parameters:
              id: "e5f6a7b8-c9d0-1234-efab-345678901234"
              config:
                className: "com.adaptavist.sr.cloud.workflow.CloneIssue"
                uuid: "f6a7b8c9-d0e1-2345-fabc-456789012345"
                enabled: true
                executionUser: "ADD_ON"
                description: "Clone issue into the same project and link it"
                linkTypeId: "%issueLinkType-blocks%" # See ${targetAtlassianSite}/rest/api/3/issueLinkType to get type numbers
                linkDirection: "Outward"
                issueTypeId: "%issueType-task%" # Numeric ID for the work item type. See ${targetAtlassianSite}/rest/api/3/project/${projectKeyOrId} for types by project or ${targetAtlassianSite}/rest/api/3/issuetype for global issue types
                projectId: "%project-acme%" # Target space, if cloning to different Space. Leave blank if same as current.
                additionalCode:
                  file: "acme/dev/LogSomething.groovy"
          # 5. Create Sub-task (CreateSubtask) — creates a subtask under the current issue
          - parameters:
              id: "a7b8c9d0-e1f2-3456-abcd-567890123456"
              config:
                className: "com.adaptavist.sr.cloud.workflow.CreateSubtask"
                uuid: "b8c9d0e1-f2a3-4567-bcde-678901234567"
                enabled: true
                executionUser: "ADD_ON"
                description: "Create a code review subtask"
                summary: "Code Review"
                issueTypeId: "%issueType-subtask%" # Numeric ID for the work item type. See ${targetAtlassianSite}/rest/api/3/project/${projectKeyOrId} for types by project or ${targetAtlassianSite}/rest/api/3/issuetype for global issue types and look for those with property subtask: true
          # 6. Fast-track Transition Work Item (FastTrackIssue) — automatically transitions the current issue
          - parameters:
              id: "c9d0e1f2-a3b4-5678-cdef-789012345678"
              config:
                className: "com.adaptavist.sr.cloud.workflow.FastTrackIssue"
                uuid: "d0e1f2a3-b4c5-6789-defa-890123456789"
                enabled: true
                executionUser: "ADD_ON"
                description: "Auto-transition to Done if no subtasks"
                transitionName: "Done"
                transitionId: "31"
                comment: "Auto-transitioned by ScriptRunner — no subtasks found"
          # 7. Send Notification (SendNotification) — sends a custom email notification
          - parameters:
              id: "e1f2a3b4-c5d6-7890-efab-901234567890"
              config:
                className: "com.adaptavist.sr.cloud.workflow.SendNotification"
                uuid: "f2a3b4c5-d6e7-8901-fabc-012345678901"
                enabled: true
                executionUser: "ADD_ON"
                description: "Notify watchers and assignee that work has started"
                subject: "Work has started on ${issue.key}"
                assignee: true
                watchers: true
                reporter: false
                voters: false
                emailCode: "'<p>Work item <b>' + issue.key + '</b> has been moved to In Progress.</p>'"
          # 8. Add/Remove from Sprint (SprintTransition) — adds or removes the issue from an active sprint
          - parameters:
              id: "a3b4c5d6-e7f8-9012-abcd-123456789abc"
              config:
                className: "com.adaptavist.sr.cloud.workflow.SprintTransition"
                uuid: "b4c5d6e7-f8a9-0123-bcde-234567890bcd"
                enabled: true
                executionUser: "ADD_ON"
                description: "Add issue to active sprint on the MARK1 board"
                action: "add"
                boardId: "%rapidView-mark1%"
          # 9. Transition Parent Work Item (TransitionParent) — transitions the parent issue when a subtask moves
          - parameters:
              id: "c5d6e7f8-a9b0-1234-cdef-345678901cde"
              config:
                className: "com.adaptavist.sr.cloud.workflow.TransitionParent"
                uuid: "d6e7f8a9-b0c1-2345-defa-456789012def"
                enabled: true
                executionUser: "ADD_ON"
                description: "Move parent to In Progress when subtask starts"
                transitionName: "In Progress"
                comment: "Parent auto-transitioned because a subtask moved to In Progress"
        conditions:
          - parameters:
              id: "4a2d7de4-3b95-40c5-b359-4dab3dd5824a"
              config:
                uuid: "7a46c9e7-9980-4164-8f85-4717b44fa9b1"
                description: "Check if any comments contain banned words"
                expression: "(issue.comments.filter(comment => comment.body.plainText.toLowerCase().includes('banned')).length <= 0)"
                enabled: true
        validators:
          - parameters:
              id: "b1340bfc-2003-41b2-9beb-621a266b489b"
              config:
                uuid: "5c3c30b5-a8e8-4d16-b5eb-c4f4a44fbcf8"
                description: "Check comments"
                expression: "(issue.comments.filter(comment => comment.body.plainText.toLowerCase().includes('banned')).length <= 0)"
                errorMessage: "No banned words in the comments."
                enabled: true
          - parameters:
              id: "414e3381-d974-4286-ac1e-ffa0f895770f"
              config:
                uuid: "46a851b6-a532-42c5-bd14-50cb6a235a98"
                description: "This will always be true. It's just an example. Insert your own validator here."
                expression: "true && !false"
                errorMessage: "If this failed ScriptRunner is broken."
                enabled: true
  - name: "SMURF: Project Management Workflow"
    transitions:
      # In workflows where more than one transition has the same name, you can disambiguate statuses using a sourceStatus, targetStatus
      # Where necessary, you can also specify a transition type (DIRECTED, GLOBAL, INITIAL)
      - name: "Done"
        sourceStatus: "In Progress"
        targetStatus: "Done"
        conditions:
          - parameters:
              id: "ee623f33-2b06-435f-a336-435dc4a3adeb"
              config:
                uuid: "2cff4359-af2d-400a-8de9-3253ba4f5c76"
                description: "Check if any comments contain disallowed words"
                expression: "(issue.comments.filter(comment => comment.body.plainText.toLowerCase().includes('disallowed')).length <= 0)"
                enabled: true
      - name: "Done"
        sourceStatus: "To Do"
        targetStatus: "Done"
        conditions:
          - parameters:
              id: "1efc887c-5190-4961-b51b-abdd1c76cfad"
              config:
                uuid: "1105f5a5-d0d8-424a-86a3-20bc59c48556"
                description: "Check if the issue description contain disallowed words"
                expression: "!issue.description.plainText.includes('disallowed')"
                enabled: true
  - name: "PRAH: Project Management Workflow"
    transitions:
      - name: "Done"
        id: "21" # As a last resort, transitions with the same name can be distinguished by their ID. This is brittle, as IDs can vary between cloud instances for identical transitions.
        conditions:
          - parameters:
              id: "142b758a-5cf3-4619-bdd2-cc40219cc94d"
              config:
                uuid: "92246de9-f297-49de-9f04-750b7474a277"
                description: "Check if any comments contain disallowed words"
                expression: "(issue.comments.filter(comment => comment.body.plainText.toLowerCase().includes('disallowed')).length <= 0)"
                enabled: true
      - name: "Done"
        id: "41"
        conditions:
          - parameters:
              id: "b4fa9a4c-f580-4f97-a73f-d3c7471e62e7"
              config:
                uuid: "ead05c99-02fa-43ca-a703-9f1bc3187e04"
                description: "Check if the issue description contain disallowed words"
                expression: "!issue.description.plainText.includes('disallowed')"
                enabled: true
  - name: "New Workflow With Conditions"
    transitions:
      - name: "In Progress"
        conditions:
          - parameters:
                id: "flat-cond-1"
                config:
                  uuid: "497dcba3-ecbf-4587-a2dd-5eb0665e6880"
                  description: "Flat root condition"
                  expression: "true"
                  enabled: true
          - groups:
              - operation: "ANY"
                conditions:
                  - parameters:
                      id: "group-cond-1"
                      config:
                        uuid: "50e14f43-dd4e-412f-864d-78943ea28d91"
                        description: "Grouped condition 1"
                        expression: "true"
                        enabled: true
                  - parameters:
                      id: "group-cond-2"
                      config:
                        uuid: "7edb3b2e-869c-485b-af70-76a934e0fcfd"
                        description: "Grouped condition 2"
                        expression: "false"
                        enabled: true
                conditionGroups:
                  - operation: "ALL"
                    conditions:
                      - parameters:
                          id: "nested-cond-1"
                          config:
                            uuid: "67e32b59-3348-4dc3-9645-75c60b6f50cc"
                            description: "Nested subgroup condition"
                            expression: "issue.status.name == '%status-open%'"
                            enabled: true
  - name: "Workflow with ordered functions"
    transitions:
      - name: "Done"
        postFunctions:
          - parameters:
              id: "9f2a8b0f-6f8e-4d82-b9de-f2f9a960aa61"
              config:
                className: "com.adaptavist.sr.cloud.workflow.UpdateIssue"
                uuid: "3e25f42d-08ad-4d79-a6d6-ae7db5da9f1c"
                description: "Does Nothing!"
                enabled: true
                executionUser: "ADD_ON"
            placement:
              index: 2
#              last: true
#              first: true
        validators:
          - parameters:
              id: "2d6f8e72-f4b0-4d6f-97b6-71895d2ee38a"
              config:
                uuid: "e6f9dd6f-c68f-4f39-a95d-3b7aa5cd34ce"
                description: "Validates Nothing!"
            placement:
              first: true

additional-scripts:
  - file: "acme/dev/ConsoleScript1.groovy"
  - file: "acme/dev/ConsoleScript2.groovy"
  - file: "acme/dev/ConsoleScript3.groovy"
